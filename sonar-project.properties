sonar.projectKey=portfolio
sonar.projectName=Portfolio
sonar.sourceEncoding=UTF-8

# Only analyse real source code
sonar.sources=app,components,lib
sonar.exclusions=**/node_modules/**,**/.next/**,public/**,**/*.config.*
sonar.cpd.exclusions=lib/data.ts
sonar.typescript.tsconfigPaths=tsconfig.json

# sonar.host.url and the token are supplied by Jenkins (withSonarQubeEnv).
# Do NOT hard-code http://localhost:9000 here: inside the Jenkins container,
# "localhost" is Jenkins itself, not SonarQube.
